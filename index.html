<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Tsukiyo Mart: Midnight Restock — a cozy konbini goods-sorting puzzle game.">
<title>Tsukiyo Mart: Midnight Restock · 月夜マート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1030'/%3E%3Ccircle cx='58' cy='42' r='26' fill='%23ffe9a8'/%3E%3Ccircle cx='70' cy='34' r='24' fill='%230b1030'/%3E%3Ctext x='50' y='88' font-size='26' text-anchor='middle' fill='%23ff8fb8' font-family='sans-serif' font-weight='bold'%3E24h%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#0b1030;--navy2:#161c4a;--ink:#4a2c3d;--cream:#fff7ea;--pink:#ff8fb8;--pink2:#ff5f95;
  --mint:#7ef0cf;--gold:#ffd66b;--cyan:#7fe8ff;--lav:#b9a7ff;
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Kosugi Maru","Arial Rounded MT Bold","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--navy);color:var(--cream);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block}
#game{position:fixed;left:0;top:0;width:100vw;height:100%;touch-action:none;z-index:1}
#fx{position:fixed;left:0;top:0;width:100vw;height:100%;pointer-events:none;z-index:60}
.screen{position:fixed;inset:0;z-index:10;display:none}
.screen.on{display:block}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;font-size:inherit}

/* ---------- candy buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:50px;padding:0 22px;border-radius:18px;
  font-size:17px;font-weight:900;letter-spacing:.02em;background:linear-gradient(#fffaf2,#ffe6c6);color:var(--ink);
  box-shadow:0 5px 0 #c9927a,0 9px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .2s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9927a,0 3px 8px rgba(0,0,0,.35)}
.btn.pink{background:linear-gradient(#ffb8d2,#ff77a6);color:#fff;box-shadow:0 5px 0 #c8467a,0 9px 20px rgba(255,80,150,.35);text-shadow:0 2px 0 rgba(160,30,80,.35)}
.btn.pink:active{box-shadow:0 1px 0 #c8467a}
.btn.mint{background:linear-gradient(#b5fbe6,#63dcb8);color:#1d4a45;box-shadow:0 5px 0 #2e9c83,0 9px 20px rgba(60,220,180,.3)}
.btn.mint:active{box-shadow:0 1px 0 #2e9c83}
.btn.navy{background:linear-gradient(#39418a,#262c68);color:#e8ebff;box-shadow:0 5px 0 #11153f,0 9px 18px rgba(0,0,0,.35)}
.btn.navy:active{box-shadow:0 1px 0 #11153f}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:14px}
.btn.block{display:flex;width:100%}
.btn[disabled],.btn.off{filter:grayscale(.85) brightness(.85);opacity:.65;pointer-events:none}

/* ---------- title ---------- */
#scr-title .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 42%,rgba(11,16,48,.05),rgba(8,10,32,.72) 75%)}
.logo-jp{font-size:clamp(50px,16vw,96px);font-weight:900;color:#fff;letter-spacing:.06em;line-height:1.05;
  text-shadow:0 0 4px #fff,0 0 12px #ff6fa8,0 0 26px #ff4f95,0 0 52px #ff3d8a;animation:flicker 6s infinite}
.logo-en{font-size:clamp(15px,4.4vw,24px);font-weight:900;letter-spacing:.34em;color:#e6fdff;margin-left:.34em;text-shadow:0 0 6px #7fe8ff,0 0 18px #36c9ff}
.logo-sub{font-size:clamp(14px,4vw,18px);font-weight:800;color:#ffe3a6;letter-spacing:.12em;margin-bottom:18px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.title-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.title-foot{position:absolute;bottom:calc(14px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;color:#aab3ea;opacity:.8;letter-spacing:.1em}
@keyframes flicker{0%,18%,20.5%,23%,54%,56.5%,100%{opacity:1}19%,22%,55%{opacity:.5}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ---------- HUD ---------- */
#scr-play{pointer-events:none}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--safe-t)) 10px 0;display:flex;align-items:center;gap:7px;pointer-events:none;max-width:640px;margin:0 auto}
.chip{pointer-events:auto;display:flex;align-items:center;gap:5px;height:42px;padding:0 11px;border-radius:14px;background:rgba(14,18,52,.78);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.15);font-weight:900;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.3);white-space:nowrap}
button.chip:active{transform:scale(.94)}
.chip.icon{width:42px;padding:0;justify-content:center;font-size:18px}
.hud .lvl{flex:1;flex-direction:column;align-items:stretch;justify-content:center;gap:4px;min-width:0}
.hud .lvl .t{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.hud .lvl .t span:last-child{color:#c9d0ff;font-size:12px}
.prog{height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ef0cf,#ffd66b,#ff8fb8);border-radius:5px;transition:width .35s}
.timer{min-width:74px;justify-content:center}
.timer.low{color:#ff8a9c;animation:pulse .6s infinite}
.combo-meter{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + var(--safe-t));height:5px;width:120px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;opacity:0;transition:opacity .2s}
.combo-meter.on{opacity:1}
.combo-meter>i{display:block;height:100%;background:linear-gradient(90deg,#ffd66b,#ff5f95)}
.boosters{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + var(--safe-b));display:flex;justify-content:center;gap:10px;pointer-events:none}
.boost{pointer-events:auto;position:relative;width:min(21vw,86px);height:66px;border-radius:18px;background:linear-gradient(#323b86,#1f255c);
  border:2px solid rgba(255,255,255,.16);box-shadow:0 5px 0 #0b0f33,0 9px 16px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.boost:active{transform:translateY(4px);box-shadow:0 1px 0 #0b0f33}
.boost .ic{font-size:23px;line-height:1}
.boost .lbl{font-size:10.5px;font-weight:900;color:#d8ddff;margin-top:3px}
.boost .cost{position:absolute;top:-8px;right:-6px;background:linear-gradient(#ffe38a,#ffc33d);color:#6b4200;font-size:11px;font-weight:900;padding:2px 6px;border-radius:9px;box-shadow:0 2px 0 #c98a14}
.boost.off{filter:grayscale(.9) brightness(.7)}
.boost.glow{animation:pulse .9s infinite;border-color:#ffd66b}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,8,28,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:16px}
.modal.on{display:flex}
.panel{position:relative;width:min(94vw,410px);max-height:90%;overflow:auto;background:linear-gradient(#fffaf2,#ffeedb);color:var(--ink);border-radius:26px;
  padding:22px 18px 20px;box-shadow:0 0 0 4px #ffd3ad inset,0 18px 50px rgba(0,0,0,.5);text-align:center;animation:popIn .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{margin:2px 0 6px;font-size:26px;color:#e2517f;letter-spacing:.02em}
.panel h3{margin:14px 0 8px;font-size:15px;color:#8a5a70;text-align:left}
.panel p{margin:6px 0;font-size:15px;line-height:1.5;font-weight:700}
.panel .muted{color:#9a7a88;font-size:13px}
.panel .btns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.panel .btns.row{flex-direction:row;justify-content:center}
.panel .btns.row .btn{flex:1;padding:0 10px}
.x-close{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:12px;background:#ffe2cc;color:#a0607a;font-size:18px;font-weight:900}
.stars-big{font-size:50px;letter-spacing:4px;height:64px;margin:4px 0}
.star{display:inline-block;color:#e7d6c8;transform:scale(0)}
.star.show{animation:starIn .55s cubic-bezier(.2,1.8,.4,1) forwards}
.star.on{color:#ffc93c;text-shadow:0 3px 0 #d98a1d,0 0 18px rgba(255,200,60,.7)}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.stat-row{display:flex;justify-content:center;gap:10px;margin:8px 0}
.stat{background:#fff;border-radius:14px;padding:8px 12px;min-width:92px;box-shadow:0 2px 0 #f0d2bb}
.stat b{display:block;font-size:20px;color:#e2517f}
.stat span{font-size:11px;color:#9a7a88;font-weight:800;letter-spacing:.05em}
.tip-art{display:block;margin:6px auto 4px;width:120px;height:120px}
.pill{display:inline-block;background:#ffe3ec;color:#c2466f;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900}

/* ---------- toggles / settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:800;box-shadow:0 2px 0 #f0d2bb;text-align:left;gap:10px}
.set-row small{display:block;font-size:12px;color:#9a7a88;font-weight:700}
.tog{position:relative;width:58px;height:32px;border-radius:20px;background:#d9c7cf;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.tog.on{background:#ff8fb8}
.tog.on::after{transform:translateX(26px)}
.set-row.audio{flex-direction:column;align-items:stretch;gap:8px}
.set-row.audio .set-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vol{display:flex;align-items:center;gap:10px;transition:opacity .2s}
.vol.off{opacity:.45}
.vol span{font-size:16px;width:20px;text-align:center}
.vol b{min-width:40px;text-align:right;font-size:13px;color:#c2466f}
.vol input{flex:1;min-width:0;height:32px;margin:0;background:none;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer;
  --p:50%}
.vol input::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(90deg,#ff8fb8 var(--p),#f0dde4 var(--p))}
.vol input::-moz-range-track{height:10px;border-radius:6px;background:#f0dde4}
.vol input::-moz-range-progress{height:10px;border-radius:6px;background:#ff8fb8}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid #ff77a6;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.vol input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #ff77a6;box-shadow:0 2px 5px rgba(0,0,0,.25)}

/* ---------- shop ---------- */
.tabs{display:flex;gap:6px;background:#ffe6d2;border-radius:16px;padding:4px;margin:8px 0 10px}
.tab{flex:1;height:38px;border-radius:12px;font-weight:900;font-size:14px;color:#a0607a}
.tab.on{background:#fff;color:#e2517f;box-shadow:0 2px 0 #f0d2bb}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 2px 0 #f0d2bb;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.card canvas{width:100%;aspect-ratio:4/3;border-radius:12px;background:#1a1f4a}
.card .nm{font-weight:900;font-size:14px}
.card .ds{font-size:11px;color:#9a7a88;font-weight:700;min-height:2.6em;line-height:1.3}
.card.eq{box-shadow:0 0 0 3px #ff8fb8}

/* ---------- dialog ---------- */
.dialog{position:fixed;inset:0;z-index:55;display:none;background:rgba(6,8,28,.35);align-items:flex-end}
.dialog.on{display:flex}
.dlg-box{position:relative;margin:0 auto calc(14px + var(--safe-b));width:min(94vw,560px);display:flex;gap:12px;align-items:flex-start;background:rgba(255,249,240,.98);color:var(--ink);
  border-radius:22px;padding:14px 14px 22px;box-shadow:0 0 0 3px #ffcfa0 inset,0 12px 40px rgba(0,0,0,.5);animation:slideUp .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.dlg-portrait{width:88px;height:88px;border-radius:20px;flex:none;box-shadow:0 0 0 3px #fff inset,0 3px 0 #f0cdb2;animation:bob 2.2s ease-in-out infinite}
.dlg-name{font-weight:900;color:#e2517f;font-size:14px;letter-spacing:.03em}
.dlg-text{font-size:16px;line-height:1.5;font-weight:700;margin-top:3px;min-height:3em}
.dlg-next{position:absolute;right:16px;bottom:6px;color:#e2517f;font-size:14px;animation:bob 1s infinite}
.dlg-skip{position:absolute;top:-40px;right:6px;pointer-events:auto}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:calc(64px + var(--safe-t));transform:translate(-50%,-16px);z-index:70;background:rgba(20,24,64,.94);border:1.5px solid rgba(255,255,255,.2);
  color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- map ---------- */
#map-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#map-scroll::-webkit-scrollbar{display:none}
#map-inner{position:relative;width:100%}
.map-hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--safe-t)) 10px 22px;display:flex;flex-wrap:wrap;row-gap:8px;gap:7px;align-items:center;justify-content:center;z-index:5;pointer-events:none;
  background:linear-gradient(rgba(8,10,32,.85),rgba(8,10,32,0))}
.map-hud .sp{flex:1}
.mode-tog{pointer-events:auto;display:flex;background:rgba(14,18,52,.85);border:1.5px solid rgba(255,255,255,.15);border-radius:14px;padding:3px;height:38px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.mode-tog button{padding:0 12px;border-radius:10px;font-weight:900;font-size:13px;color:#b8c0f0;white-space:nowrap}
.mode-tog button.on{background:linear-gradient(#ffb8d2,#ff77a6);color:#fff}
.node{position:absolute;transform:translate(-50%,-50%);width:78px;display:flex;flex-direction:column;align-items:center;gap:3px}
.node .sign{position:relative;width:66px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#3b2a4a;
  background:linear-gradient(#ffffff 0 56%,#7ee0c3 56% 68%,#ffffff 68% 76%,#ff9dbf 76%);
  box-shadow:0 0 0 3px #2c3264,0 0 22px rgba(255,238,190,.6),0 6px 0 3px #0d1238;padding-bottom:12px}
.node .st{font-size:14px;color:#ffd66b;text-shadow:0 0 6px rgba(255,200,60,.7),0 2px 0 #000;letter-spacing:1px;height:16px;line-height:16px}
.node .st .e{color:#4a5288;text-shadow:none}
.node.locked .sign{background:linear-gradient(#3a4175,#2a3060);color:#7880b6;box-shadow:0 0 0 3px #1d2250,0 6px 0 3px #0d1238;font-size:18px}
.node.cur .sign{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 3px #ff77a6,0 0 30px rgba(255,120,170,.9),0 6px 0 3px #0d1238}
.node.cur::before{content:"▼";position:absolute;top:-24px;color:#ff8fb8;font-size:16px;text-shadow:0 0 8px #ff5f95;animation:bob .8s infinite}
.node.endless{width:240px}
.node.endless .sign{width:220px;height:62px;font-size:17px;white-space:nowrap;padding:0 8px 12px;background:linear-gradient(#2a1f5c 0 70%,#ff5fa2 70% 80%,#2a1f5c 80%);color:#fff;
  text-shadow:0 0 8px #ff77c8;box-shadow:0 0 0 3px #ff77c8,0 0 30px rgba(255,100,200,.7),0 6px 0 3px #0d1238}
.node.endless.locked .sign{filter:grayscale(.8) brightness(.7)}
.neon{position:absolute;font-weight:900;font-size:19px;line-height:1.18;text-align:center;padding:8px 6px;border:2px solid currentColor;border-radius:9px;
  text-shadow:0 0 5px currentColor,0 0 14px currentColor;box-shadow:0 0 12px currentColor,inset 0 0 10px currentColor;opacity:.92;animation:flicker 8s infinite;pointer-events:none;background:rgba(10,12,40,.55)}
.store{position:absolute;left:50%;transform:translateX(-50%);width:min(90vw,340px);pointer-events:none;text-align:center}
.store .aw{height:26px;border-radius:10px 10px 4px 4px;background:repeating-linear-gradient(90deg,#ff9dbf 0 22px,#fff4f8 22px 44px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.store .bd{margin:0 10px;padding:8px 8px 10px;background:linear-gradient(#fdfcf7,#e9f6f1);border-radius:0 0 10px 10px;color:#3b2a4a;box-shadow:0 0 30px rgba(255,240,200,.45)}
.store .nm{font-size:22px;font-weight:900;letter-spacing:.1em}
.store .br{font-size:12px;font-weight:900;color:#2e9c83}
.store .ch{margin-top:6px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000}
.store .ch small{display:block;color:#ffe3a6;font-size:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<section id="scr-title" class="screen">
  <div class="wrap">
    <div class="logo-jp">月夜マート</div>
    <div class="logo-en">TSUKIYO MART</div>
    <div class="logo-sub">✦ Midnight Restock ✦</div>
    <button class="btn pink" id="btn-start" style="min-width:230px;min-height:58px;font-size:19px">🌙 Start Night Shift</button>
    <div class="title-row">
      <button class="btn navy small" id="btn-shop-t">🎀 Shop</button>
      <button class="btn navy small" id="btn-set-t">⚙️ Settings</button>
      <button class="btn navy small" id="btn-snd-t" aria-label="Sound">🔊</button>
    </div>
  </div>
  <div class="title-foot">OPEN 24H · 午前2時 · Drag or tap to sort</div>
</section>

<section id="scr-map" class="screen">
  <div id="map-scroll"><div id="map-inner"></div></div>
  <div class="map-hud">
    <button class="chip icon" id="map-home" aria-label="Title">🏠</button>
    <div class="chip" id="map-stars">★ 0</div>
    <div class="chip" id="map-coins">🪙 0</div>
    <button class="chip icon" id="map-shop" aria-label="Shop">🎀</button>
    <button class="chip icon" id="map-set" aria-label="Settings">⚙️</button>
    <div style="flex-basis:100%;height:0"></div>
    <div class="mode-tog" id="mode-tog"><button data-m="relaxed">🌙 Relaxed</button><button data-m="timed">⏱ Timed · ★★★</button></div>
  </div>
</section>

<section id="scr-play" class="screen">
  <div class="hud">
    <button class="chip icon" id="btn-pause" aria-label="Pause">⏸</button>
    <div class="chip lvl"><div class="t"><span id="hud-level">Lv 1</span><span id="hud-left">0 left</span></div><div class="prog"><i id="hud-prog"></i></div></div>
    <div class="chip timer" id="hud-timer">🌙 ∞</div>
    <div class="chip" id="hud-coins">🪙 0</div>
  </div>
  <div class="combo-meter" id="combo-meter"><i></i></div>
  <div class="boosters">
    <button class="boost" id="b-hint"><span class="cost">15</span><span class="ic">💡</span><span class="lbl">Hint</span></button>
    <button class="boost" id="b-undo"><span class="cost">20</span><span class="ic">↩️</span><span class="lbl">Undo</span></button>
    <button class="boost" id="b-shuffle"><span class="cost">40</span><span class="ic">🔀</span><span class="lbl">Shuffle</span></button>

<script>
'use strict';
/* =====================================================================
   月夜マート · Tsukiyo Mart: Midnight Restock
   Single-file game. Sections:
   1 utils · 2 save · 3 logic · 4 levels & story · 5 art · 6 audio
   7 renderer · 8 input · 9 game controller · 10 screens · 11 boot
   ===================================================================== */

/* ============================ 1. UTILS ============================ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function mulberry32(a) {

  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }

}
const pickR = (arr, rng = Math.random) => arr[Math.floor(rng() * arr.length)];
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

/* ============================ 2. SAVE ============================ */
const SAVE_KEY = 'tsukiyo-mart-save-v1';
const defaultSave = () => ({
  v: 1, coins: 150, stars: {}, best: {}, seen: {}, tips: {}, mode: 'relaxed',
  themes: ['classic'], theme: 'classic', decors: ['none'], decor: 'none',
  settings: { music: true, rain: true, sfx: true, musicVol: .8, rainVol: .3, sfxVol: .8, vibe: true, pixel: false },
  endlessBest: 0, endlessStage: 1, epilogue: false,
});
let SAVE = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    const d = defaultSave();
    SAVE = Object.assign(d, raw ? JSON.parse(raw) : {});
    SAVE.settings = Object.assign(defaultSave().settings, SAVE.settings || {});
  } catch (e) { SAVE = defaultSave(); }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* private mode */ } }
const levelUnlocked = n => n === 1 || (SAVE.stars[n - 1] || 0) > 0;
const totalStars = () => Object.values(SAVE.stars).reduce((a, b) => a + b, 0);

/* ============================ 3. LOGIC ============================
   A board is a grid of slots. Each slot has a `front` row of 3 positions
   and `layers` of 3-position rows stacked behind it (layers[0] is next).
   Slot types: 'shelf' (normal), 'box' (taped cardboard, hp), 'lock'.
   Items: {u: uid, k: kind index | CAT, ice: 0/1, key: 0/1}
   ================================================================== */
const CAT = 100;           // Maneki-neko lucky cat wildcard
let UID = 1;
const mkItem = k => ({ u: UID++, k, ice: 0, key: 0 });
const cloneItem = i => i ? { u: i.u, k: i.k, ice: i.ice, key: i.key } : null;
function cloneState(s) {
  return {
    cols: s.cols, rows: s.rows, grid: s.grid, keys: s.keys,
    slots: s.slots.map(sl => ({
      id: sl.id, r: sl.r, c: sl.c, type: sl.type, hp: sl.hp, nb: sl.nb,
      front: sl.front.map(cloneItem), layers: sl.layers.map(l => l.map(cloneItem)),
    })),

}
const empty3 = () => [null, null, null];
const rowEmpty = r => !r[0] && !r[1] && !r[2];
const compat = (a, b) => a.k === CAT || b.k === CAT || a.k === b.k;

function isMatch(f) {
  if (!f[0] || !f[1] || !f[2]) return false;
  let k = -1;
  for (const it of f) {
    if (it.ice) return false;
    if (it.k !== CAT) { if (k === -1) k = it.k; else if (k !== it.k) return false; }
  }
  return true;
}
function countLeft(s) {
  let n = 0;
  for (const sl of s.slots) {
    for (const it of sl.front) if (it && it.k !== CAT) n++;
    for (const l of sl.layers) for (const it of l) if (it && it.k !== CAT) n++;
  }

}
function countAll(s) {
  let n = 0;
  for (const sl of s.slots) { for (const it of sl.front) if (it) n++; for (const l of sl.layers) for (const it of l) if (it) n++; }
  return n;
}
const canPick = (s, si, p) => { const sl = s.slots[si]; return !!(sl && sl.type === 'shelf' && sl.front[p] && !sl.front[p].ice); };
const hasSpace = sl => sl.type === 'shelf' && (!sl.front[0] || !sl.front[1] || !sl.front[2]);

function applyMove(s, a, pa, b, pb) {
  const it = s.slots[a].front[pa];
  s.slots[a].front[pa] = null;
  s.slots[b].front[pb] = it;
  const ev = [];
  resolve(s, [b, a], ev);

}

// The lucky cat beckons one matching good from anywhere on the board.
function summon(s, k) {
  const tiers = [[], [], []];
  for (const sl of s.slots) {
    const t0 = sl.type === 'shelf' ? 0 : 2, t1 = sl.type === 'shelf' ? 1 : 2;
    sl.front.forEach((it, p) => { if (it && it.k === k) tiers[t0].push({ sl, layer: -1, p }); });
    sl.layers.forEach((l, li) => l.forEach((it, p) => { if (it && it.k === k) tiers[t1].push({ sl, layer: li, p }); }));
  }

    if (!tier.length) continue;
    tier.sort((a, b) => a.layer - b.layer);
    const f = tier[0];
    const row = f.layer < 0 ? f.sl.front : f.sl.layers[f.layer];
    const item = row[f.p]; row[f.p] = null;

function resolve(s, list, ev) {

    if (!sl || sl.type !== 'shelf') continue;
    if (isMatch(sl.front)) {

      const e = { t: 'match', slot: si, items, summoned: [] };
      ev.push(e);
      const nonCat = items.filter(i => i.k !== CAT);
      const cats = 3 - nonCat.length;
      if (nonCat.length && cats) {
        for (let i = 0; i < cats; i++) {
          const f = summon(s, nonCat[0].k);
          if (f) { if (f.item.ice) f.item.ice = 0; e.summoned.push(f); q.push(f.slot); }

        if (!it.key) continue;

        if (lk) { lk.type = 'shelf'; q.push(lk.id); }
        ev.push({ t: 'key', slot: si, u: it.u, lock: lk ? lk.id : -1 });

        const ns = s.slots[n];
        if (ns.type === 'box') {
          ns.hp--; ev.push({ t: 'boxhit', slot: n, hp: ns.hp });
          if (ns.hp <= 0) { ns.type = 'shelf'; q.push(n); }
        } else if (ns.type === 'shelf') {
          ns.front.forEach((it, p) => { if (it && it.ice) { it.ice = 0; ev.push({ t: 'thaw', slot: n, p, u: it.u }); q.push(n); } });
        }
      }
      q.push(si);
      continue;
    }
    if (rowEmpty(sl.front) && sl.layers.length) {
      sl.front = sl.layers.shift();
      ev.push({ t: 'advance', slot: si });
      q.push(si);
    }
  }
  for (const sl of s.slots) sl.layers = sl.layers.filter(l => !rowEmpty(l));
  // Only lucky cats left? They wave goodbye.
  if (countLeft(s) === 0) {
    const cats = [];
    for (const sl of s.slots) {
      sl.front.forEach((it, p) => { if (it) { cats.push({ item: it, slot: sl.id, layer: -1, p }); sl.front[p] = null; } });
      sl.layers.forEach((l, li) => l.forEach((it, p) => { if (it) { cats.push({ item: it, slot: sl.id, layer: li, p }); l[p] = null; } }));
      sl.layers = [];
    }
    if (cats.length) ev.push({ t: 'bye', items: cats });
  }
}

function listMoves(s) {
  const mv = [], tg = [];
  for (const sl of s.slots) if (hasSpace(sl)) tg.push(sl);
  if (!tg.length) return mv;
  for (const sl of s.slots) {
    if (sl.type !== 'shelf') continue;
    for (let p = 0; p < 3; p++) {
      const it = sl.front[p];
      if (!it || it.ice) continue;
      for (const t of tg) { if (t.id !== sl.id) mv.push([sl.id, p, t.id, t.front.indexOf(null)]); }
    }
  }
  return mv;
}

function evalMove(s, m) {
  const A = s.slots[m[0]], B = s.slots[m[2]], it = A.front[m[1]];
  const others = B.front.filter(Boolean);
  let sc = 0;
  if (others.length === 2) {
    const trio = [it, ...others];
    if (isMatch(trio)) sc += 100; else sc -= 12;
  } else if (others.length === 1) {
    if (!others[0].ice && compat(it, others[0])) sc += (it.k === CAT ? 8 : 18); else sc -= 4;
  } else sc += 1;

  if (rest.length === 2 && rest.every(x => !x.ice) && compat(rest[0], rest[1])) sc += 3;
  return sc;
}

// Can a triple ever be made again? Only goods that aren't iced, boxed or locked
// can take part (front rows and the rows behind them on open shelves). Ice, tape
// and locks only give way to a match, so if no kind has three such goods (lucky
// cats fill any gap), the board is a dead end no matter how goods are moved.
function canEverMatch(s) {
  const cnt = new Map(); let cats = 0;
  for (const sl of s.slots) {
    if (sl.type !== 'shelf') continue;
    for (const row of [sl.front, ...sl.layers]) for (const it of row) {
      if (!it || it.ice) continue;
      if (it.k === CAT) cats++; else cnt.set(it.k, (cnt.get(it.k) || 0) + 1);

  for (const n of cnt.values()) if (n + cats >= 3) return true;

}
const isStuck = s => countLeft(s) > 0 && (!listMoves(s).length || !canEverMatch(s));

// Tenchō's free rescue for a dead end: thaw every good, tear off all tape, open
// every locked shelf, and shuffle if the shelves are still packed. Returns events.
function rescueBoard(s, rng = Math.random) {
  const ev = [];
  for (const sl of s.slots) {
    if (sl.type === 'box') { sl.hp = 0; sl.type = 'shelf'; ev.push({ t: 'boxhit', slot: sl.id, hp: 0 }); }
    else if (sl.type === 'lock') { sl.type = 'shelf'; ev.push({ t: 'unlock', slot: sl.id }); }
    sl.front.forEach((it, p) => { if (it && it.ice) { it.ice = 0; ev.push({ t: 'thaw', slot: sl.id, p, u: it.u }); } });
    for (const row of sl.layers) for (const it of row) if (it) { it.ice = 0; it.key = 0; }
    for (const it of sl.front) if (it) it.key = 0;
  }
  resolve(s, s.slots.map(x => x.id), ev);
  if (countLeft(s) > 0 && !listMoves(s).length) ev.push(...shuffleBoard(s, rng));
  return ev;
}

function bestMove(s) {
  let best = null, bs = -1e9;
  for (const m of listMoves(s)) { const v = evalMove(s, m); if (v > bs) { bs = v; best = m; } }
  return best ? { m: best, score: bs } : null;
}

function playout(s0, rng, maxSteps) {
  const s = cloneState(s0);
  for (let i = 0; i < maxSteps; i++) {
    if (countLeft(s) === 0) return true;
    const mv = listMoves(s);
    if (!mv.length) return false;
    let best = null, bs = -1e9;
    for (const m of mv) { const v = evalMove(s, m) + rng() * 12; if (v > bs) { bs = v; best = m; } }
    applyMove(s, best[0], best[1], best[2], best[3]);

}
function solvable(s, seed, tries) {

  return false;
}

// Shuffle the movable goods on accessible shelves (booster). Returns events.
function shuffleBoard(s, rng = Math.random) {
  const spots = [], items = [];
  for (const sl of s.slots) {
    if (sl.type !== 'shelf') continue;
    for (let p = 0; p < 3; p++) {
      const it = sl.front[p];
      if (it && it.ice) continue;
      spots.push([sl, p]);
      if (it) items.push(it);
      sl.front[p] = null;
    }
  }
  shuffleArr(spots, rng);
  // Greedy: try to group same kinds so the shuffle feels lucky.
  items.sort((a, b) => a.k - b.k);
  const bySlot = new Map();
  for (const [sl, p] of spots) { if (!bySlot.has(sl)) bySlot.set(sl, []); bySlot.get(sl).push(p); }
  const groups = shuffleArr([...bySlot.entries()], rng);
  let idx = 0;
  const cut = Math.floor(items.length * 0.4);
  const head = items.slice(0, cut), tail = shuffleArr(items.slice(cut), rng);
  const order = rng() < 0.5 ? head.concat(tail) : tail.concat(head);
  for (const [sl, ps] of groups) for (const p of ps) { if (idx < order.length) sl.front[p] = order[idx++]; }

  resolve(s, s.slots.map(x => x.id), ev);
  return ev;
}

/* ---------- level generation ---------- */
function parseGrid(g) {
  const rows = g.length, cols = Math.max(...g.map(r => r.length));
  const slots = [], grid = [];
  for (let r = 0; r < rows; r++) {
    grid.push([]);
    for (let c = 0; c < cols; c++) {
      const ch = g[r][c] || '.';
      if (ch === '.') { grid[r].push(-1); continue; }
      const type = ch === 'S' ? 'shelf' : ch === 'L' ? 'lock' : 'box';
      const sl = { id: slots.length, r, c, type, hp: type === 'box' ? +ch : 0, nb: [], front: empty3(), layers: [] };
      grid[r].push(sl.id); slots.push(sl);
    }
  }
  for (const sl of slots) {
    for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const r = sl.r + dr, c = sl.c + dc;
      if (r >= 0 && r < rows && c >= 0 && c < cols && grid[r][c] >= 0) sl.nb.push(grid[r][c]);
    }
  }
  return { cols, rows, grid, slots, keys: 0 };
}

function buildOnce(def, seed) {
  const rng = mulberry32(seed);
  const s = parseGrid(def.g);
  const shelves = s.slots.filter(x => x.type === 'shelf');
  const counts = [];
  for (const sl of s.slots) {
    let d = def.d + (def.v ? Math.round((rng() * 2 - 1) * def.v) : 0);
    d = Math.max(1, d);
    if (sl.type !== 'shelf') d = clamp(d, 1, 2);

    for (let i = 0; i < d; i++) {
      if (i === 0 && sl.type === 'shelf') c.push(d === 1 ? pickR([1, 2, 2, 2, 3], rng) : pickR([1, 1, 2, 2, 2], rng));

  let empties = shelves.reduce((a, sl) => a + 3 - counts[sl.id][0], 0);
  for (let g = 0; empties < minEmpty && g < 200; g++) {
    const sl = pickR(shelves, rng);
    if (counts[sl.id][0] > 1) { counts[sl.id][0]--; empties++; }
  }
  let total = counts.reduce((a, c) => a + c.reduce((x, y) => x + y, 0), 0);
  for (let g = 0; total % 3 && g < 500; g++) {
    const sl = pickR(s.slots, rng); const c = counts[sl.id];
    const li = Math.floor(rng() * c.length);

  }

  const k = Math.max(1, Math.min(def.k, T, 14));
  const poolSize = Math.min(14, def.k + 3);
  const pool = shuffleArr([...Array(poolSize).keys()], rng).slice(0, k);
  const kinds = [];
  for (let i = 0; i < T; i++) { const kd = pool[i % k]; kinds.push(kd, kd, kd); }
  shuffleArr(kinds, rng);
  let idx = 0;
  const rows = [];
  for (const sl of s.slots) {
    const layers = counts[sl.id].map(n => {
      const arr = empty3();
      for (const p of shuffleArr([0, 1, 2], rng).slice(0, n)) arr[p] = mkItem(kinds[idx++]);
      return arr;
    });
    sl.front = layers[0] || empty3();
    sl.layers = layers.slice(1);
    rows.push(sl.front, ...sl.layers);
  }

  for (let g = 0; g < 400; g++) {
    const bad = rows.find(r => isMatch(r));
    if (!bad) break;
    const other = pickR(rows, rng); const op = Math.floor(rng() * 3);
    const bp = Math.floor(rng() * 3);

    [bad[bp], other[op]] = [other[op], bad[bp]];
    if (isMatch(other)) [bad[bp], other[op]] = [other[op], bad[bp]];
  }
  // Lucky cats: never next to a ready pair.
  const shelfRows = [];
  for (const sl of shelves) shelfRows.push(sl.front, ...sl.layers);
  for (let c = 0; c < (def.cat || 0); c++) {
    const cands = shelfRows.filter(r => r.includes(null) && !(r.filter(Boolean).length === 2 && compat(r.filter(Boolean)[0], r.filter(Boolean)[1])));
    if (!cands.length) break;
    const r = pickR(cands, rng); const ps = [0, 1, 2].filter(p => !r[p]);
    r[pickR(ps, rng)] = mkItem(CAT);
  }
  const shelfItems = [];
  shelves.forEach(sl => [sl.front, ...sl.layers].forEach((r, li) => r.forEach(it => { if (it && it.k !== CAT) shelfItems.push({ it, li }); })));
  shuffleArr(shelfItems, rng);
  let ice = def.ice || 0;
  for (const o of shelfItems) { if (ice <= 0) break; o.it.ice = 1; ice--; }
  // Don't leave a board with nothing to move.
  if (!listMoves(s).length) return null;
  const locks = s.slots.filter(x => x.type === 'lock').length;
  const locked = new Set();
  s.slots.forEach(sl => { if (sl.type === 'lock') [sl.front, ...sl.layers].forEach(r => r.forEach(it => { if (it) locked.add(it.k); })); });
  const keyOk = shelfItems.filter(o => !o.it.ice && !locked.has(o.it.k));
  const keyC = (keyOk.length >= locks ? keyOk : shelfItems.filter(o => !o.it.ice)).sort((a, b) => (b.li > 0) - (a.li > 0));
  for (let i = 0; i < locks && i < keyC.length; i++) keyC[i].it.key = 1;
  return s;
}

function genLevel(def, seed) {
  for (let a = 0; a < 40; a++) {
    const saveUid = UID;
    const s = buildOnce(def, seed + a * 7919);
    if (!s) continue;
    if (solvable(s, seed + a, def.tries || 8)) return s;
    UID = saveUid;
  }
  return buildOnce(def, seed) || buildOnce(Object.assign({}, def, { ice: 0 }), seed);
}

/* ======================= 4. LEVELS & STORY =======================

   k kinds · d layers deep (incl. front) · v depth variance · ice · cat
   ================================================================== */
const LEVELS = [
  /* Chapter 1 · Rainy Station Street */
  { g: ['SSS', 'SSS'], k: 3, d: 1, me: 5 },
  { g: ['SSS', 'SSS', 'SSS'], k: 4, d: 1, me: 5 },
  { g: ['SSS', 'SSS'], k: 4, d: 2 },
  { g: ['SSS', 'SSS', 'SSS'], k: 5, d: 2 },
  { g: ['SSS', 'SSS', 'SSS'], k: 5, d: 2, cat: 1 },
  { g: ['SSS', 'S.S', 'SSS'], k: 6, d: 2, v: 1 },
  { g: ['SSS', 'SSS', 'SSS', 'SSS'], k: 6, d: 2, cat: 1 },
  { g: ['SSS', 'SSS', 'SSS'], k: 6, d: 2, ice: 3 },
  { g: ['S.S', 'SSS', 'SSS', 'S.S'], k: 7, d: 3, ice: 3 },
  { g: ['SSS', 'SSS', 'SSS', 'SSS'], k: 7, d: 3, ice: 4, cat: 1 },
  /* Chapter 2 · Summer Festival Lane */
  { g: ['SSS', 'SSS', 'SSS'], k: 7, d: 3 },
  { g: ['.S.', 'SSS', 'SSS', 'SSS'], k: 8, d: 3, ice: 4 },
  { g: ['S1S', 'SSS', 'SSS'], k: 7, d: 2 },
  { g: ['1SS', 'SSS', 'SS1'], k: 8, d: 3 },
  { g: ['SSS', 'S2S', 'SSS', 'SSS'], k: 8, d: 3, ice: 3, cat: 1 },
  { g: ['SSS', 'SSS', 'SSS', 'SSS'], k: 9, d: 3, v: 1, ice: 5 },
  { g: ['S1S', 'SSS', 'SSS', 'S2S'], k: 8, d: 3, cat: 2 },
  { g: ['SSS', '2S2', 'SSS', 'SSS'], k: 9, d: 3, ice: 4 },
  { g: ['SLS', 'SSS', 'SSS'], k: 8, d: 3 },

function endlessDef(stage, seed) {
  const rng = mulberry32(seed);
  const rows = Math.min(5, 3 + Math.floor(stage / 3));
  const g = [];
  for (let r = 0; r < rows; r++) g.push(['S', 'S', 'S']);
  const cells = shuffleArr([...Array(rows * 3).keys()], rng);
  let ci = 0;
  const nBox = Math.min(4, Math.floor(stage / 3)), nLock = stage >= 4 ? Math.min(2, Math.floor(stage / 5)) : 0;
  for (let i = 0; i < nBox; i++) { const c = cells[ci++]; g[Math.floor(c / 3)][c % 3] = String(1 + Math.floor(rng() * Math.min(3, 1 + stage / 5))); }
  for (let i = 0; i < nLock; i++) { const c = cells[ci++]; g[Math.floor(c / 3)][c % 3] = 'L'; }
  if (stage > 5 && rng() < 0.35) { const c = cells[ci++]; g[Math.floor(c / 3)][c % 3] = '.'; }
  return {
    g: g.map(r => r.join('')), k: Math.min(14, 5 + Math.floor(stage * 0.7)), d: Math.min(5, 2 + Math.floor(stage / 4)),
    v: stage > 6 ? 1 : 0, ice: Math.min(10, Math.floor(stage * 0.8)), cat: stage % 2 ? 1 : 0,
  };
}

function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); }
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function stk(c, lw = 4, col = OUTL) { c.lineWidth = lw; c.strokeStyle = col; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function fil(c, f) { c.fillStyle = f; c.fill(); }
function lg(c, x0, y0, x1, y1, ...stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }
function rg(c, x, y, r0, r1, ...stops) { const g = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }

function rTri(c, ax, ay, bx, by, cx, cy, r) {
  c.beginPath(); c.moveTo((ax + bx) / 2, (ay + by) / 2);
  c.arcTo(bx, by, cx, cy, r); c.arcTo(cx, cy, ax, ay, r); c.arcTo(ax, ay, bx, by, r); c.closePath();
}
function face(c, x, y, s = 1, o = {}) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(255,105,145,.5)'; ell(c, -15, 6, 5.5, 3.2); c.fill(); ell(c, 15, 6, 5.5, 3.2); c.fill();
  c.fillStyle = OUTL; c.strokeStyle = OUTL; c.lineCap = 'round';
  if (o.happy) {
    c.lineWidth = 3; c.beginPath(); c.arc(-9, 2, 4, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
    c.beginPath(); c.arc(9, 2, 4, Math.PI * 1.15, Math.PI * 1.85); c.stroke();

    c.lineWidth = 2.6; c.beginPath(); c.moveTo(-12, 0); c.lineTo(-6, 0); c.moveTo(6, 0); c.lineTo(12, 0); c.stroke();
  } else {
    ell(c, -9, 0, 3.3, 3.9); c.fill(); ell(c, 9, 0, 3.3, 3.9); c.fill();

  }
  c.beginPath(); c.moveTo(-4, 5.5); c.quadraticCurveTo(-2, 9, 0, 6.2); c.quadraticCurveTo(2, 9, 4, 5.5);
  c.lineWidth = 2.3; c.stroke();
  c.restore();
}

/* ============================ 6. AUDIO ============================
   Everything is synthesized with Web Audio: juicy SFX and a lofi
   city-pop loop (royal-road progression · FM e-piano · bass · drums)
   and a rain ambience bed. Music, rain and SFX each have their own
   channel with an on/off switch and a volume level.
   ================================================================== */
const Sound = (() => {
  let ctx = null, master, sfxBus, musicBus, rainBus, musicIn, noiseBuf, ambient = null;
  // Loudest gain each channel reaches at 100%. Rain tops out low so the music leads.
  const MAX = { music: .6, rain: .45, sfx: .9 };
  const bus = ch => ch === 'music' ? musicBus : ch === 'rain' ? rainBus : sfxBus;
  const level = ch => SAVE.settings[ch] ? MAX[ch] * clamp(SAVE.settings[ch + 'Vol'] ?? 1, 0, 1) : 0;
  function applyGain(ch, tc = .08) {
    if (!ctx) return;
    const g = bus(ch).gain;
    g.cancelScheduledValues(ctx.currentTime);
    g.setTargetAtTime(level(ch), ctx.currentTime, tc);
  }
  let timer = null, step = 0, nextT = 0, loopN = 0, playing = false;
  const BPM = 84, STEP = 60 / BPM / 4;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .2;
    master = ctx.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = level('sfx'); sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
    rainBus = ctx.createGain(); rainBus.gain.value = 0; rainBus.connect(master);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = .4;
    musicIn = ctx.createGain(); musicIn.gain.value = 1; musicIn.connect(lp); lp.connect(musicBus);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (SAVE.settings.music) startMusic();
    if (SAVE.settings.rain) { startAmbient(); applyGain('rain', .8); }
  }

  function tone(f, dur, o = {}) {
    if (!ctx) return;
    const t = (o.t ?? ctx.currentTime) + (o.delay || 0);
    const osc = ctx.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + (o.slideT || dur));
    if (o.detune) osc.detune.value = o.detune;

function computeLayout(st) {

  const slots = st.slots.map(sl => {
    const x = x0 + sl.c * (slotW + gap), y = y0 + sl.r * (rH + rowGap);
    return { id: sl.id, x, y, w: slotW, h: rH, base: y + rH - size * .2 };

    ell(c, 130, 28, 18, 18); fil(c, '#fff'); stk(c, 3, '#7a5230'); c.fillStyle = '#7a5230'; c.font = '900 24px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('2', 130, 29);
    c.restore(); c.fillStyle = '#fff'; c.font = '900 20px sans-serif'; c.textAlign = 'center'; c.fillText('match next to it = rip!', 120, 205);
  } else if (kind === 'lock') {

    c.save(); c.translate(170, 110); rr(c, -26, -18, 52, 42, 9); fil(c, lg(c, 0, -18, 0, 24, '#ffe58a', '#f2b92c')); stk(c, 3, '#9a6a10');
    c.beginPath(); c.arc(0, -18, 16, Math.PI, 0); c.lineWidth = 7; c.strokeStyle = '#d9dce8'; c.stroke(); c.restore();
    c.fillStyle = '#fff'; c.font = '900 20px sans-serif'; c.textAlign = 'center'; c.fillText('clear the tagged good', 120, 205);

}
function showTip(tip, done) {
  G.paused = true;
  const p = openModal(`<span class="pill">NEW!</span><h2>${tip.title}</h2><div id="tip-art"></div><p>${tip.text}</p>
    <div class="btns"><button class="btn pink block" data-act="ok">Got it! ♡</button></div>`, {
    ok: () => { closeModal(); SAVE.tips[tip.key] = 1; persist(); G.paused = false; if (done) done(); },
  });
  p.querySelector('#tip-art').appendChild(tipArt(tip.art));
}

/* ---------- flow ---------- */
function enterLevel(n, skipStory) {
  Sound.init();
  if (n === 'endless') { startLevel('endless'); return; }
  startLevel(n);
  const tip = TIPS[n];
  const afterStory = () => { if (tip && !SAVE.tips[tip.key]) showTip(tip); };
  if (!skipStory && STORY[n] && !SAVE.seen[n]) { SAVE.seen[n] = 1; persist(); playStory(STORY[n], afterStory); }
  else afterStory();
}
function showTitle() { closeModal(); setMode('title'); syncSoundBtn(); }
function showMap() {
  closeModal();
  G.state = null; R.L = null;
  setMode('map');
  buildMap();
}

/* ---------- map ---------- */
function currentLevel() { for (let n = 1; n <= LEVELS.length; n++) if (!SAVE.stars[n]) return n; return LEVELS.length + 1; }
function buildMap() {
  mapLayout();
  const inner = $('#map-inner'), sc = $('#map-scroll');
  inner.style.height = MAP.H + 'px';
  inner.innerHTML = '';
  const cur = currentLevel();
  MAP.chapters.forEach(c => {
    const ch = CHAPTERS[c.ch], el = document.createElement('div');
    el.className = 'store'; el.style.top = (c.y - 70) + 'px';
    el.innerHTML = `<div class="aw"></div><div class="bd"><div class="nm">月夜マート</div><div class="br">${ch.branch}</div></div>

    inner.appendChild(el);
  });

  const cols = ['#ff7ab0', '#7fe8ff', '#ffd66b', '#b9a7ff', '#7ef0cf', '#ff9a6b'];

    b.setAttribute('aria-label', 'Level ' + n);

    inner.appendChild(b);

  const e = document.createElement('button'), eo = !!SAVE.stars[LEVELS.length];

  e.innerHTML = `<div class="sign">∞ Endless Night Shift</div><div class="st" style="color:#ffd6ea">${eo ? `Best: Stage ${SAVE.endlessBest || 0}` : '🔒 Clear Level 40'}</div>`;
  e.onclick = () => { Sound.init(); if (!eo) { Sound.play('bad'); toast('Finish all 40 shifts to unlock Endless mode! 🌙'); return; } Sound.play('click'); enterLevel('endless'); };
  inner.appendChild(e);
  $('#map-stars').textContent = `★ ${totalStars()}`;
  $('#map-coins').textContent = `🪙 ${SAVE.coins}`;
  document.querySelectorAll('#mode-tog button').forEach(b => b.classList.toggle('on', b.dataset.m === SAVE.mode));
  const target = cur <= LEVELS.length ? MAP.nodes[cur - 1].y : MAP.endless.y;
  sc.scrollTop = target - H * .58;
}
document.querySelectorAll('#mode-tog button').forEach(b => b.addEventListener('click', () => {
  Sound.init(); Sound.play('click');
  SAVE.mode = b.dataset.m; persist();
  document.querySelectorAll('#mode-tog button').forEach(x => x.classList.toggle('on', x === b));
  toast(SAVE.mode === 'timed' ? '⏱ Timed: beat the clock for ★★★!' : '🌙 Relaxed: no timer, just vibes.');
}));
$('#map-home').onclick = () => { Sound.play('click'); showTitle(); };
$('#map-shop').onclick = () => { Sound.play('click'); showShop(); };
$('#map-set').onclick = () => { Sound.play('click'); showSettings(); };
$('#btn-shop-t').onclick = () => { Sound.init(); Sound.play('click'); showShop(); };
$('#btn-set-t').onclick = () => { Sound.init(); Sound.play('click'); showSettings(); };
const AUDIO = ['music', 'rain', 'sfx'];
const anySound = () => AUDIO.some(ch => SAVE.settings[ch]);
function syncSoundBtn() { $('#btn-snd-t').textContent = anySound() ? '🔊' : '🔇'; }
$('#btn-snd-t').onclick = () => {
  Sound.init();
  const on = !anySound();
  AUDIO.forEach(ch => Sound.setChannel(ch, on)); syncSoundBtn();
  Sound.play('click'); toast(on ? '🔊 Sound on — enjoy the lofi beats!' : '🔇 Sound off');
};
$('#btn-start').onclick = () => {
  Sound.init(); Sound.play('click');

};

/* ---------- settings ---------- */
const SET_LABEL = {
  music: ['🎵 Lofi music', 'City-pop beats'], rain: ['🌧️ Rain ambience', 'Soft rain & vinyl crackle'],
  sfx: ['🔊 Sound effects', 'Pops, chimes & meows'],
  vibe: ['📳 Vibration', 'Buzz on pops (phones)'], pixel: ['👾 Pixel-art goods', 'Retro crunchy sprites'],
};
const volPct = ch => Math.round((SAVE.settings[ch + 'Vol'] ?? 1) * 100);
function settingsRows(keys) {
  return keys.map(k => {
    const head = `<div>${SET_LABEL[k][0]}<small>${SET_LABEL[k][1]}</small></div><button class="tog ${SAVE.settings[k] ? 'on' : ''}" data-set="${k}" aria-label="${SET_LABEL[k][0]} on/off"></button>`;
    if (!AUDIO.includes(k)) return `<div class="set-row">${head}</div>`;
    const v = volPct(k);
    return `<div class="set-row audio"><div class="set-top">${head}</div>
      <div class="vol ${SAVE.settings[k] ? '' : 'off'}" data-volrow="${k}"><span>🔈</span>
      <input type="range" min="0" max="100" step="1" value="${v}" style="--p:${v}%" data-vol="${k}" aria-label="${SET_LABEL[k][0]} volume"><b>${v}%</b></div></div>`;
  }).join('');
}
function wireToggles(p) {
  const syncRow = k => {
    const t = p.querySelector(`[data-set="${k}"]`), r = p.querySelector(`[data-volrow="${k}"]`);
    if (t) t.classList.toggle('on', !!SAVE.settings[k]);
    if (r) r.classList.toggle('off', !SAVE.settings[k]);
  };
  p.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
    Sound.init();
    const k = b.dataset.set, on = !SAVE.settings[k];
    if (AUDIO.includes(k)) Sound.setChannel(k, on);
    else { SAVE.settings[k] = on; persist(); }
    syncRow(k);
    if (k === 'pixel') { SPR.px = 0; R.bgKey = ''; if (R.L) buildSprites(R.L.size); }
    if (k === 'vibe' && on) vibrate(30);
    Sound.play('click');
  }));
  p.querySelectorAll('[data-vol]').forEach(inp => {
    const k = inp.dataset.vol, label = inp.nextElementSibling;
    const show = () => { inp.style.setProperty('--p', inp.value + '%'); label.textContent = inp.value + '%'; };
    inp.addEventListener('input', () => {
      Sound.init();
      if (!SAVE.settings[k] && +inp.value > 0) { Sound.setChannel(k, true); syncRow(k); }
      Sound.setVolume(k, inp.value / 100, false); show();
    });
    inp.addEventListener('change', () => {
      Sound.setVolume(k, inp.value / 100, true);
      if (k === 'sfx') Sound.play('pop', 3);
    });
  });
}
function showSettings() {
  const p = openModal(`<button class="x-close" data-act="close">✕</button><h2>Settings ⚙️</h2>
    ${settingsRows(['music', 'rain', 'sfx', 'vibe', 'pixel'])}
    <div class="btns"><button class="btn small block" data-act="story">📖 Replay the opening story</button>
    <button class="btn small block" data-act="reset" style="color:#c2466f">🗑 Reset all progress</button></div>
    <p class="muted" style="margin-top:14px">月夜マート · Tsukiyo Mart: Midnight Restock<br>All art & sound made with code. No ads, no purchases — boosters use coins you earn. ♡</p>`, {
    close: closeModal,
    story: () => { closeModal(); playStory(STORY[1].concat(STORY[2])); },
    reset: () => {
      openModal(`<h2>Reset everything?</h2><p>Stars, coins, cosmetics and story progress will be erased.</p>
        <div class="btns row"><button class="btn small" data-act="no">Keep it</button><button class="btn pink small" data-act="yes">Reset</button></div>`, {
        no: showSettings,
        yes: () => { SAVE = defaultSave(); persist(); closeModal(); R.bgKey = ''; SPR.px = 0; AUDIO.forEach(ch => Sound.setChannel(ch, true)); syncSoundBtn(); toast('Fresh start! 🌱'); if (R.mode === 'map') buildMap(); },
      });
    },
  });

}

/* ---------- shop (cosmetics) ---------- */
let shopTab = 'themes';
function previewCanvas(kind, key) {
  const c2 = document.createElement('canvas'); c2.width = 240; c2.height = 180;
  const c = c2.getContext('2d');
  if (kind === 'themes') {
    const th = THEMES[key];
    c.fillStyle = '#141a42'; c.fillRect(0, 0, 240, 180);
    const size = 44;
    [[10, 12], [10, 94]].forEach(([x, y], r) => {
      const L = { id: r, x: x + 6, y, w: 208, h: size * 1.62, base: y + size * 1.62 - size * .2 };
      drawShelfBg(c, L, th, size);
      [r * 3, r * 3 + 5, r * 3 + 9].forEach((k, p) => { c.save(); c.translate(posX(L, p) - size / 2, L.base - size); c.scale(size / 100, size / 100); artFor(k % 14)(c); c.restore(); });
    });
  } else {
    c.fillStyle = lg(c, 0, 0, 0, 180, '#070a24', '#231f58', '#3a2a66'); c.fillRect(0, 0, 240, 180);
    ell(c, 190, 44, 20, 20); fil(c, '#ffe9a8');
    c.fillStyle = '#12143a'; [[0, 110, 50, 70], [54, 90, 40, 90], [98, 120, 60, 60], [162, 100, 78, 80]].forEach(r => c.fillRect(...r));
    if (key === 'none' || key === 'sakura') { c.strokeStyle = 'rgba(185,205,255,.5)'; c.lineWidth = 1.5; c.beginPath(); for (let i = 0; i < 40; i++) { const x = (i * 37) % 250, y = (i * 53) % 180; c.moveTo(x, y); c.lineTo(x + 3, y - 14); } c.stroke(); }
    if (key === 'sakura') { for (let i = 0; i < 14; i++) blossom(c, 10 + i * 17, 16 + Math.sin(i) * 6, 8, i % 2 ? '#ffc4d8' : '#ffe1ea'); for (let i = 0; i < 12; i++) { c.fillStyle = '#ffc4d8'; ell(c, (i * 47) % 230 + 5, (i * 29) % 150 + 30, 4, 2.4, i); c.fill(); } }
    if (key === 'summer') {
      for (const [x, y, col] of [[60, 50, '#ff8fb8'], [150, 70, '#ffd66b']]) for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; c.fillStyle = col; c.fillRect(x + Math.cos(a) * 26, y + Math.sin(a) * 26, 3, 3); }
      for (let i = 0; i < 4; i++) { c.save(); c.shadowColor = '#ff9a6b'; c.shadowBlur = 12; ell(c, 30 + i * 60, 22, 12, 16); fil(c, i % 2 ? '#ff5f5f' : '#fff4e0'); c.restore(); }
    }
    if (key === 'winter') {
      c.fillStyle = '#fff'; for (let i = 0; i < 40; i++) { ell(c, (i * 41) % 240, (i * 67) % 180, 1.5 + (i % 3), 1.5 + (i % 3)); c.fill(); }
      for (let i = 0; i < 8; i++) { c.save(); c.shadowColor = ['#ff6b7a', '#ffd66b', '#7ef0cf', '#7fe8ff'][i % 4]; c.shadowBlur = 10; ell(c, 15 + i * 30, 12, 4, 5); fil(c, ['#ff6b7a', '#ffd66b', '#7ef0cf', '#7fe8ff'][i % 4]); c.restore(); }
      c.fillStyle = 'rgba(235,248,255,.6)'; c.fillRect(0, 160, 240, 20);
    }
  }
  return c2;
}
function showShop() {
  const list = shopTab === 'themes' ? THEMES : DECORS;
  const owned = shopTab === 'themes' ? SAVE.themes : SAVE.decors;
  const eq = shopTab === 'themes' ? SAVE.theme : SAVE.decor;
  const stars = totalStars();
  const cards = Object.entries(list).map(([k, it]) => {
    const has = owned.includes(k), need = it.stars || 0, lockedByStars = !has && stars < need;
    const btn = k === eq ? `<button class="btn mint small" disabled>✓ Using</button>` :
      has ? `<button class="btn small" data-act="equip" data-k="${k}">Use</button>` :
        lockedByStars ? `<button class="btn small" disabled>🔒 ★${need}</button>` :
          `<button class="btn pink small" data-act="buy" data-k="${k}">🪙 ${it.cost}</button>`;
    return `<div class="card ${k === eq ? 'eq' : ''}"><div class="pv" data-k="${k}"></div><div class="nm">${it.name}</div><div class="ds">${it.desc}</div>${btn}</div>`;
  }).join('');
  const p = openModal(`<button class="x-close" data-act="close">✕</button><h2>Cosmetics Shop 🎀</h2>
    <p class="muted">🪙 ${SAVE.coins} coins · ★ ${stars} stars · Earned by playing, never paid</p>
    <div class="tabs"><button class="tab ${shopTab === 'themes' ? 'on' : ''}" data-act="tab" data-t="themes">🗄 Shelf Themes</button><button class="tab ${shopTab === 'decor' ? 'on' : ''}" data-act="tab" data-t="decor">🌸 Seasonal Decor</button></div>
    <div class="shop-grid">${cards}</div>`, {
    close: () => { closeModal(); if (R.mode === 'map') buildMapHud(); },
    tab: b => { shopTab = b.dataset.t; showShop(); },
    equip: b => { if (shopTab === 'themes') SAVE.theme = b.dataset.k; else SAVE.decor = b.dataset.k; persist(); R.bgKey = ''; initWeather(); showShop(); },
    buy: b => {
      const k = b.dataset.k, it = list[k];
      if (SAVE.coins < it.cost) { Sound.play('bad'); toast(`Need ${it.cost - SAVE.coins} more 🪙 — keep restocking!`); return; }
      SAVE.coins -= it.cost; owned.push(k);
      if (shopTab === 'themes') SAVE.theme = k; else SAVE.decor = k;
      persist(); R.bgKey = ''; initWeather(); Sound.play('coin'); Sound.play('unlock'); confetti(60);
      toast(`Unlocked ${it.name}! ✨`); showShop();
    },
  });
  p.querySelectorAll('.pv').forEach(el => el.replaceWith(previewCanvas(shopTab === 'themes' ? 'themes' : 'decor', el.dataset.k)));
}
function buildMapHud() { $('#map-stars').textContent = `★ ${totalStars()}`; $('#map-coins').textContent = `🪙 ${SAVE.coins}`; }

/* ============================ 11. BOOT ============================ */
let lastT = performance.now(), gcT = 0;
function frame(t) {
  const dt = Math.min(1 / 30, Math.max(0, (t - lastT) / 1000)); lastT = t; NOW = t; T = t / 1000;
  runSched();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (R.mode === 'map') drawMap(ctx, dt);
  else {
    ensureBg();
    let sx = 0, sy = 0;
    if (R.shake > 0) { R.shake = Math.max(0, R.shake - dt * 3.2); const a = R.shake * R.shake * 8; sx = rand(-a, a); sy = rand(-a, a); }
    ctx.fillStyle = '#0b1030'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(sx, sy);
    ctx.drawImage(R.bg, 0, 0, W, H);
    drawWindowDynamic(ctx, dt);
    if (R.mode === 'play' && G.state && R.L) {
      ctx.imageSmoothingEnabled = !SAVE.settings.pixel;
      for (const sl of G.state.slots) drawSlot(ctx, sl, R.L.slots[sl.id], dt);
      drawGhosts(ctx, dt);
      drawHintSlot(ctx);
      drawHeld(ctx);
      ctx.imageSmoothingEnabled = true;
      R.parts = updParts(R.parts, dt); drawParts(ctx, R.parts);
      drawTexts(ctx, dt);
      drawComboLabel(ctx, dt);
    }
    ctx.restore();
  }
  updateTimer(dt);
  drawFx(dt);
  gcT += dt;
  if (gcT > 2) { gcT = 0; for (const [u, v] of R.vis) if (NOW - v.seen > 3000) R.vis.delete(u); }
  requestAnimationFrame(frame);
}
function boot() {
  loadSave();
  resize();
  window.addEventListener('resize', () => { clearTimeout(boot.rt); boot.rt = setTimeout(resize, 80); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && R.mode === 'play' && !modalOpen() && !dialogOpen()) showPause();
    if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey) && R.mode === 'play') useBooster('undo');
  });
  document.addEventListener('pointerdown', () => Sound.init(), { once: false, passive: true });
  showTitle();
  requestAnimationFrame(frame);
}
boot();
</script>
